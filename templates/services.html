{% extends 'base.html' %}
{% block title %}{{ page.title }} — ЛЕДІ{% endblock %}
{% block content %}
<div class="services-layout {{ 'services-without-menu' if not page.menu else '' }}" data-services-preview>
    {% if page.menu %}
    <nav class="services-sidebar" aria-label="Розділи послуг">
        {% for item in page.menu if item.enabled %}
        <a href="{{ item.url }}" data-service-nav>{{ item.title }}</a>
        {% endfor %}
    </nav>
    {% endif %}
    <div class="services-content" id="services">
        {% include 'page_blocks.html' %}
    </div>
</div>
{% endblock %}
